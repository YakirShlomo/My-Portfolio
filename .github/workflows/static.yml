# Build the Vite React app and deploy it to GitHub Pages
name: Deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify build output is the Vite bundle, not raw source
        run: |
          FILE="dist/index.html"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE does not exist — build did not produce output"
            exit 1
          fi
          if grep -q '/src/main.jsx' "$FILE"; then
            echo "::error::$FILE still references /src/main.jsx — this is the unbuilt source HTML, not the Vite bundle"
            exit 1
          fi
          if grep -q 'href="/favicon.svg"' "$FILE"; then
            echo "::error::$FILE references href=\"/favicon.svg\" without the base path — this is the unbuilt source HTML"
            exit 1
          fi
          if ! grep -q '/My-Portfolio/assets/' "$FILE"; then
            echo "::error::$FILE does not reference /My-Portfolio/assets/ — bundled, base-prefixed assets are missing"
            exit 1
          fi
          if ! grep -q 'href="/My-Portfolio/favicon.svg"' "$FILE"; then
            echo "::error::$FILE does not reference href=\"/My-Portfolio/favicon.svg\" — favicon is not base-prefixed"
            exit 1
          fi
          echo "OK: dist/index.html is the built, base-prefixed Vite bundle."
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

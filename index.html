    <script>
      /* Must run synchronously, before any deferred/module script, so the
         browser never gets a chance to restore a prior scroll position on
         reload — a deferred script (including type="module") runs too late
         for this. Always land on the Hero on load/refresh. */
      if ('scrollRestoration' in history) {
        try { history.scrollRestoration = 'manual'; } catch (e) { /* noop */ }
      }
      window.scrollTo(0, 0);
    </script>
    <script>
      /* GitHub Pages has no server-side rewrites: a hard reload on a nested
         route 404s, and public/404.html redirects here with the original
         path+query packed into ?redirect=. Restore it before React Router
         reads the URL, so router.jsx (which runs in a deferred module
         script) sees the real route instead of always seeing "/". */
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          history.replaceState(null, '', '/My-Portfolio/' + redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
